# Dev stack: Postgres for the API. `make dev` runs the API on the host against this.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: restro
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d restro"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  pgdata:
