version: v2
modules:
  - path: .
deps:
  - buf.build/bufbuild/protovalidate
lint:
  use:
    - STANDARD
  except:
    - PACKAGE_VERSION_SUFFIX # package is restaurant.v1; dir layout already carries v1
    # We return the resource directly (GetSettings -> Settings) and share OrderResult
    # across order commands. Deliberate: cleaner contract, and Connect evolves a resource
    # by adding optional fields without forking per-RPC wrappers.
    - RPC_RESPONSE_STANDARD_NAME
    - RPC_REQUEST_STANDARD_NAME # reports share RangeRequest across range-based RPCs
    - RPC_REQUEST_RESPONSE_UNIQUE
breaking:
  use:
    - FILE
