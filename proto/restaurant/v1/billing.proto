syntax = "proto3";

package restaurant.v1;

import "buf/validate/validate.proto";
import "restaurant/v1/common.proto";
import "restaurant/v1/order.proto";
import "restaurant/v1/settings.proto";

// ---------------------------------------------------------------------------
// BillingService — bills, immutable invoices, payments, cancellation, printing.
// Online-only (needs connectivity for numbering); commands still carry command_id
// for safe retries. Split-equally = one invoice paid by N RecordPayment calls.
// ---------------------------------------------------------------------------

enum PaymentMethod {
  PAYMENT_METHOD_UNSPECIFIED = 0;
  PAYMENT_METHOD_CASH = 1;
  PAYMENT_METHOD_CARD = 2;
  PAYMENT_METHOD_QR_FONEPAY = 3;
  PAYMENT_METHOD_QR_OTHER = 4;
}

enum DiscountType {
  DISCOUNT_TYPE_UNSPECIFIED = 0;
  DISCOUNT_TYPE_PERCENT = 1; // value is basis points
  DISCOUNT_TYPE_AMOUNT = 2;  // value is paisa
}

enum InvoiceStatus {
  INVOICE_STATUS_UNSPECIFIED = 0;
  INVOICE_STATUS_ISSUED = 1;
  INVOICE_STATUS_CANCELLED = 2;
}

message DiscountInput {
  DiscountType type = 1;
  int64 value = 2;            // bp if PERCENT, paisa if AMOUNT
  string reason = 3;         // required when non-zero
  optional ManagerApproval approval = 4; // required when over the role's limit
}

message InvoiceLine {
  LocalText name = 1;
  string variant_name = 2;
  repeated LocalText modifiers = 3;
  int32 quantity = 4;
  int64 unit_price_paisa = 5;
  int64 line_total_paisa = 6;
  string order_item_id = 7;        // server id of the billed order line
  string order_item_client_id = 8; // client id of the billed order line
  LocalText variant = 9;           // bilingual variant name (unset when the line has no variant)
}

message Payment {
  string id = 1;
  PaymentMethod method = 2;
  int64 amount_paisa = 3;
  string reference = 4;
  string confirmed_by_user_id = 5;
  int64 created_at_unix = 6;
  string shift_id = 7; // the collector's shift the payment was taken in
}

// The seller's details captured when the invoice was issued; reprints show these,
// never today's settings.
message InvoiceSeller {
  LocalText name = 1;
  string address = 2;
  string pan_number = 3;
  int32 vat_rate_bp = 4;
  string logo_url = 5;
  bool vat_registered = 6;
}

// One print of an invoice (the first is the original). Feeds the IRD sales book's
// Printed_Time / Printed_by columns.
message InvoicePrint {
  int64 at_unix = 1;
  string by_user_id = 2;
  string by_name = 3;
}

message Invoice {
  string id = 1;
  string fiscal_year = 2;
  int32 number = 3;
  BillingMode mode = 4;
  string bs_date = 5;      // YYYY.MM.DD
  int64 ad_datetime_unix = 6;
  string order_id = 7;
  string buyer_name = 8;
  string buyer_pan = 9;
  int64 subtotal_paisa = 10;
  int64 discount_paisa = 11;
  int64 service_charge_paisa = 12;
  int64 taxable_paisa = 13;
  int64 vat_paisa = 14;
  int64 rounding_paisa = 15;
  int64 total_paisa = 16;
  InvoiceStatus status = 17;
  int32 print_count = 18;
  repeated InvoiceLine lines = 19;
  repeated Payment payments = 20;
  // --- captured at issue time, immutable ---
  InvoiceSeller seller = 21;
  string display_number = 22;       // "E-2083/84-12" (estimate) or "2083/84-12" (tax invoice)
  string discount_reason = 23;
  string issued_by_user_id = 24;
  string issued_by_name = 25;
  string place = 26;                // table name, counter-sale label, or "Takeaway"
  string order_client_id = 27;
  // --- cancellation (empty / 0 while ISSUED) ---
  string cancel_reason = 28;
  int64 cancelled_at_unix = 29;
  string cancelled_by_user_id = 30;
  string cancel_approved_by_user_id = 31;
  // Every print, oldest first; prints[0] is the original.
  repeated InvoicePrint prints = 32;
}

// Computed-but-not-persisted preview of a bill.
message BillPreview {
  int64 subtotal_paisa = 1;
  int64 discount_paisa = 2;
  int64 service_charge_paisa = 3;
  int64 taxable_paisa = 4;
  int64 vat_paisa = 5;
  int64 rounding_paisa = 6;
  int64 total_paisa = 7;
}

message PreviewBillRequest {
  string order_client_id = 1 [(buf.validate.field).string.min_len = 1];
  optional DiscountInput discount = 2;
}

message IssueFullBillRequest {
  string command_id = 1 [(buf.validate.field).string.min_len = 1];
  string order_client_id = 2 [(buf.validate.field).string.min_len = 1];
  optional DiscountInput discount = 3;
  string buyer_name = 4;
  string buyer_pan = 5;
}

message LineGroup {
  repeated string order_item_ids = 1 [(buf.validate.field).repeated.min_items = 1];
}

message SplitByItemRequest {
  string command_id = 1 [(buf.validate.field).string.min_len = 1];
  string order_client_id = 2 [(buf.validate.field).string.min_len = 1];
  repeated LineGroup groups = 3 [(buf.validate.field).repeated.min_items = 1];
}
message SplitByItemResponse {
  repeated Invoice invoices = 1;
}

message RecordPaymentRequest {
  string command_id = 1 [(buf.validate.field).string.min_len = 1];
  string invoice_id = 2 [(buf.validate.field).string.min_len = 1];
  PaymentMethod method = 3 [(buf.validate.field).enum = {defined_only: true, not_in: [0]}];
  int64 amount_paisa = 4 [(buf.validate.field).int64.gt = 0];
  string reference = 5;
}

message CancelInvoiceRequest {
  string command_id = 1 [(buf.validate.field).string.min_len = 1];
  string invoice_id = 2 [(buf.validate.field).string.min_len = 1];
  string reason = 3 [(buf.validate.field).string.min_len = 1];
  ManagerApproval approval = 4;
}

message MarkPrintedRequest {
  string invoice_id = 1 [(buf.validate.field).string.min_len = 1];
}
message PrintInfo {
  bool is_original = 1;   // first print
  int32 copy_number = 2;  // "Copy of Original (n)" when not original
  int32 print_count = 3;
}

message GetInvoiceRequest {
  string id = 1 [(buf.validate.field).string.min_len = 1];
}

// One tender of a bill paid at issue time. Validated by the service (not
// protovalidate) so every payment problem is reported as INVALID field "payments".
message PaymentInput {
  PaymentMethod method = 1;
  int64 amount_paisa = 2;
  string reference = 3;
}

// Issue + pay in one transaction. item_ids empty = every unbilled, non-voided item
// of the order; otherwise a subset (a split bill), which still takes a discount and
// buyer details. payments must be non-empty, each > 0, and sum to the invoice total.
// Needs the caller's open shift. Retries with the same command_id return the same invoice.
message IssueBillRequest {
  string command_id = 1 [(buf.validate.field).string.min_len = 1];
  string order_client_id = 2 [(buf.validate.field).string.min_len = 1];
  repeated string item_ids = 3;
  optional DiscountInput discount = 4; // carries reason + manager approval
  string buyer_name = 5;
  string buyer_pan = 6;
  repeated PaymentInput payments = 7;
}

// Counter (pay first): creates a TAKEAWAY order, its lines already SENT, and the
// paid invoice in one transaction. Any rejected line rejects the whole sale
// (INVALID field "lines"). order_client_id is optional (generated when blank).
message CounterSaleRequest {
  string command_id = 1 [(buf.validate.field).string.min_len = 1];
  string order_client_id = 2;
  string label = 3; // printed as the invoice's place (blank = "Takeaway")
  repeated NewItem lines = 4;
  optional DiscountInput discount = 5;
  string buyer_name = 6;
  string buyer_pan = 7;
  repeated PaymentInput payments = 8;
}

// AD half-open range [from_unix, to_unix) in unix seconds.
message InvoiceDayRange {
  int64 from_unix = 1;
  int64 to_unix = 2;
}

// Invoices newest first, cancelled ones included (with their status).
message ListInvoicesRequest {
  oneof filter {
    option (buf.validate.oneof).required = true;
    string order_client_id = 1;
    string bs_date = 2; // YYYY.MM.DD
    InvoiceDayRange ad_range = 3;
  }
}
message ListInvoicesResponse {
  repeated Invoice invoices = 1;
}

service BillingService {
  rpc PreviewBill(PreviewBillRequest) returns (BillPreview);
  rpc IssueFullBill(IssueFullBillRequest) returns (Invoice);
  rpc SplitByItem(SplitByItemRequest) returns (SplitByItemResponse);
  rpc RecordPayment(RecordPaymentRequest) returns (Payment);        // attaches to the collector's open shift
  rpc CancelInvoice(CancelInvoiceRequest) returns (Invoice);        // reopens the order
  rpc MarkPrinted(MarkPrintedRequest) returns (PrintInfo);
  rpc GetInvoice(GetInvoiceRequest) returns (Invoice);
  rpc IssueBill(IssueBillRequest) returns (Invoice);                // issue + pay in one step
  rpc CounterSale(CounterSaleRequest) returns (Invoice);            // takeaway order + paid invoice in one step
  rpc ListInvoices(ListInvoicesRequest) returns (ListInvoicesResponse);
}
