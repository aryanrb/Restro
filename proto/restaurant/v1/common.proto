syntax = "proto3";

package restaurant.v1;

// Shared enums and messages used across every service.
//
// MONEY: every monetary field is an int64 named *_paisa (Rs 1 = 100 paisa).
// The server computes all totals, VAT and service charge; clients only display.
//
// RATES: percentages are basis points, int32 named *_bp (13% = 1300).

// Role gates which screens and actions a user has. Mirrors the web `Role` union.
enum Role {
  ROLE_UNSPECIFIED = 0;
  ROLE_OWNER = 1;
  ROLE_MANAGER = 2;
  ROLE_CASHIER = 3;
  ROLE_WAITER = 4;
  ROLE_KITCHEN = 5;
}

// UI language. Maps to the web "en"/"ne" union in the Connect adapter.
enum Language {
  LANGUAGE_UNSPECIFIED = 0;
  LANGUAGE_EN = 1;
  LANGUAGE_NE = 2;
}

// Bilingual label. Nepali falls back to English when ne is blank (client-side).
message LocalText {
  string en = 1;
  string ne = 2;
}

// Move direction for sort reordering (areas, tables, categories, items, stations).
enum Move {
  MOVE_UNSPECIFIED = 0;
  MOVE_UP = 1;
  MOVE_DOWN = 2;
}

// Machine-readable error reason. Sent as a Connect error *detail* (ErrorInfo)
// alongside a Connect code, so clients branch on `reason`, not on message text.
//
// Connect code mapping (server convention):
//   INVALID_CREDENTIALS, PIN_LOCKED, DEVICE_NOT_SHARED -> code: unauthenticated
//     (except a wrong password/PIN, which carries a reason so the client does NOT
//      treat it as "session expired" — see auth notes)
//   STALE_VERSION, ITEM_86D, ORDER_CLOSED, DUPLICATE         -> code: failed_precondition / already_exists
//   NOT_ALLOWED, MANAGER_APPROVAL_REQUIRED/INVALID           -> code: permission_denied
//   IN_USE                                                   -> code: failed_precondition
//   INVALID                                                  -> code: invalid_argument
//   NOT_FOUND                                                -> code: not_found
//   SHIFT_NOT_OPEN                                           -> code: failed_precondition
enum ErrorReason {
  ERROR_REASON_UNSPECIFIED = 0;
  ERROR_REASON_INVALID_CREDENTIALS = 1;
  ERROR_REASON_PIN_LOCKED = 2;
  ERROR_REASON_DEVICE_NOT_SHARED = 3;
  ERROR_REASON_STALE_VERSION = 4;
  ERROR_REASON_NOT_ALLOWED = 5;
  ERROR_REASON_IN_USE = 6;
  ERROR_REASON_DUPLICATE = 7;
  ERROR_REASON_INVALID = 8;
  ERROR_REASON_ITEM_86D = 9;
  ERROR_REASON_MANAGER_APPROVAL_REQUIRED = 10;
  ERROR_REASON_MANAGER_APPROVAL_INVALID = 11;
  ERROR_REASON_ORDER_CLOSED = 12;
  ERROR_REASON_SHIFT_NOT_OPEN = 13;
  ERROR_REASON_NOT_FOUND = 14;
  // Credit customers (credit.proto / on-account billing) -> code: failed_precondition
  ERROR_REASON_CREDIT_LIMIT_EXCEEDED = 15; // over available credit without a manager approval
  ERROR_REASON_CUSTOMER_INACTIVE = 16;     // no new credit on a deactivated account
  ERROR_REASON_REPAYMENT_TOO_HIGH = 17;    // repayment more than the balance owed
  // Inventory: UNIT_LOCKED -> failed_precondition
  // (an item with movements can't change unit), ITEM_UNTRACKED -> failed_precondition
  // (waste/count on an untracked or inactive item), COUNT_ALREADY_POSTED -> failed_precondition.
  ERROR_REASON_UNIT_LOCKED = 18;
  ERROR_REASON_ITEM_UNTRACKED = 19;
  ERROR_REASON_COUNT_ALREADY_POSTED = 20;
  // Analytics: a range over 3 fiscal years (3 × 366 days) -> invalid_argument.
  ERROR_REASON_RANGE_TOO_LARGE = 23;
  // Purchases (purchases.proto) -> code: failed_precondition / already_exists
  ERROR_REASON_DUPLICATE_SUPPLIER_BILL = 24; // same supplier bill no. on a recorded bill (already_exists)
  ERROR_REASON_PAYMENT_TOO_HIGH = 25;        // supplier payment more than what is owed
  ERROR_REASON_RETURN_TOO_HIGH = 26;         // return quantity more than bought - already returned
  ERROR_REASON_NOT_A_VAT_BILL = 27;          // VAT bill without supplier PAN + VAT registration + bill no.
  // Reservations (reservations.proto) -> code: failed_precondition.
  ERROR_REASON_TABLE_ALREADY_BOOKED = 28; // a table is in an overlapping booking; message = its id
  ERROR_REASON_INVALID_STATUS = 29;       // not allowed from the booking's status (or restore on another day)
  ERROR_REASON_TOO_EARLY = 30;            // no-show before the booking time
  ERROR_REASON_RESERVATIONS_OFF = 31;     // reservations are switched off in settings
  // Loyalty (loyalty.proto, billing customer_id / redeem) -> code: failed_precondition.
  // PHONE_TAKEN is sent as DUPLICATE "phone", CONSENT_REQUIRED as INVALID "consent",
  // CARD_LINK_INVALID as NOT_FOUND "token".
  ERROR_REASON_LOYALTY_OFF = 32;         // loyalty is switched off in settings
  ERROR_REASON_NOT_A_MEMBER = 33;        // the customer is not a loyalty member (field "customer_id")
  ERROR_REASON_OWN_NUMBER = 34;          // the biller's own phone number on their own bill
  ERROR_REASON_NO_REWARD = 35;           // no reward ready (or the birthday reward is not available)
  ERROR_REASON_REWARD_EXCEEDS_BILL = 36; // subtotal - discount is less than the reward
  // Guest table ordering (guest.proto).
  ERROR_REASON_TABLE_CODE_INVALID = 37; // unknown or regenerated table code, or an inactive table (not_found)
  ERROR_REASON_GUEST_ORDERING_OFF = 38; // off for the restaurant or this table; the menu is still readable (failed_precondition)
  ERROR_REASON_TOO_MANY_PENDING = 39;   // the table already has 3 guest orders waiting (failed_precondition)
  ERROR_REASON_RATE_LIMITED = 40;       // too many guest submits/calls from this table or address (resource_exhausted)
  ERROR_REASON_ALREADY_HANDLED = 41;    // the guest request was already accepted/rejected/done; message = who handled it (failed_precondition)
}

// Carried as a google.rpc-style error detail on every non-OK response.
// `field` names the offending input for DUPLICATE/INVALID (e.g. "username").
message ErrorInfo {
  ErrorReason reason = 1;
  string field = 2;
  string message = 3;
}

// Inline manager-PIN override, embedded in privileged commands (void after prepare,
// discount beyond a role's limit, invoice cancellation). The server validates the
// PIN belongs to an active OWNER/MANAGER and records that user as the approver in
// the same transaction. Absent/blank when no override is attempted.
message ManagerApproval {
  string manager_user_id = 1;
  string pin = 2;
}
