syntax = "proto3";

package restaurant.v1;

import "buf/validate/validate.proto";
import "restaurant/v1/common.proto";

// ---------------------------------------------------------------------------
// MenuService — categories, items (+variants, colors, photos), modifier groups,
// and 86 (out-of-stock) toggling. OWNER/MANAGER write; everyone reads.
// Editing the menu never changes old orders or bills (the server snapshots
// name/variant/modifiers/price onto each order item at add time).
// ---------------------------------------------------------------------------

message Category {
  string id = 1;
  LocalText name = 2;
  int32 sort = 3;
  bool active = 4;
}

// One ingredient of a recipe, per 1 unit sold: an inventory item and a quantity in
// thousandths of its base unit (see InventoryService).
message RecipeLine {
  string inventory_item_id = 1;
  int64 quantity_milli = 2;
}

message Variant {
  string id = 1;
  LocalText name = 2;
  int64 price_paisa = 3;
  // Own recipe, which REPLACES the item recipe when has_own_recipe is true
  // (an own recipe may be empty). false = use the item recipe.
  repeated RecipeLine recipe = 4;
  bool has_own_recipe = 5;
}

message Modifier {
  string id = 1;
  LocalText name = 2;
  int64 price_delta_paisa = 3;
  repeated RecipeLine recipe = 4; // ADDED to the dish's recipe
}

message ModifierGroup {
  string id = 1;
  int64 version = 2;
  LocalText name = 3;
  int32 min = 4;
  int32 max = 5;
  repeated Modifier modifiers = 6;
}

message MenuItem {
  string id = 1;
  int64 version = 2;
  string category_id = 3;
  LocalText name = 4;
  int64 price_paisa = 5; // ignored when variants exist
  string color = 6;      // hex from the fixed palette
  optional string image_url = 7;
  string station_id = 8;
  bool active = 9;
  bool is_86d = 10;
  repeated Variant variants = 11;
  repeated string modifier_group_ids = 12;
  int32 sort = 13;
  repeated RecipeLine recipe = 14; // per 1 sold; empty = no recipe (deducts nothing)
}

message Menu {
  repeated Category categories = 1;
  repeated MenuItem items = 2;
  repeated ModifierGroup modifier_groups = 3;
}

// ---- inputs ----

// Variants and modifiers are upserted by id: a set id updates that row in place
// (its id stays stable), an unset id creates one, and rows left out are deleted.
message VariantInput {
  optional string id = 1; // must belong to this item
  LocalText name = 2;
  int64 price_paisa = 3;
}

message MenuItemInput {
  optional string id = 1;
  string category_id = 2 [(buf.validate.field).string.min_len = 1];
  LocalText name = 3;
  int64 price_paisa = 4; // required > 0 only when variants is empty
  string color = 5; // one of the web ITEM_COLORS palette, else INVALID(color)
  string station_id = 6 [(buf.validate.field).string.min_len = 1];
  bool active = 7;
  repeated VariantInput variants = 8;
  repeated string modifier_group_ids = 9;
}

message ModifierInput {
  optional string id = 1; // must belong to this group; upserted like VariantInput
  LocalText name = 2;
  int64 price_delta_paisa = 3 [(buf.validate.field).int64.gte = 0];
}

message ModifierGroupInput {
  optional string id = 1;
  LocalText name = 2;
  int32 min = 3 [(buf.validate.field).int32.gte = 0];
  int32 max = 4 [(buf.validate.field).int32.gte = 1];
  repeated ModifierInput modifiers = 5 [(buf.validate.field).repeated.min_items = 1];
}

// ---- requests ----

message GetMenuRequest {}

message SaveCategoryRequest {
  optional string id = 1;
  LocalText name = 2;
  bool active = 3;
}
message DeleteCategoryRequest {
  string id = 1;
} // IN_USE if it has items
message DeleteCategoryResponse {}
message MoveCategoryRequest {
  string id = 1;
  Move move = 2;
}
message MoveCategoryResponse {}

message SaveItemRequest {
  MenuItemInput input = 1;
  optional int64 version = 2; // required when input.id is set
}
// Moves within the item's category. Changing category on SaveItem puts the item last there.
message MoveItemRequest {
  string id = 1;
  Move move = 2;
}
message MoveItemResponse {}

message SetItemImageRequest {
  string id = 1;
  bytes image = 2;        // <= 1 MB; empty clears the image
  string content_type = 3; // image/jpeg | image/png | image/webp
}

message Set86Request {
  repeated string ids = 1 [(buf.validate.field).repeated.min_items = 1];
  bool is_86d = 2;
}
message Set86Response {}

message SaveModifierGroupRequest {
  ModifierGroupInput input = 1;
  optional int64 version = 2;
}
message DeleteModifierGroupRequest {
  string id = 1;
} // IN_USE if any item links it
message DeleteModifierGroupResponse {}

// A variant's own recipe; absent from SaveRecipeRequest.variant_recipes = unchanged.
message VariantRecipe {
  string variant_id = 1;
  bool use_item_recipe = 2;        // true = drop the own recipe (lines ignored)
  repeated RecipeLine lines = 3;   // the own recipe (may be empty)
}

// Owner/manager. Applies from now on (past stock movements never change). Bumps the
// item's version; STALE_VERSION on a wrong base_version.
message SaveRecipeRequest {
  string menu_item_id = 1;
  repeated RecipeLine recipe = 2;
  repeated VariantRecipe variant_recipes = 3;
  int64 base_version = 4;
}

message SaveModifierRecipeRequest {
  string modifier_id = 1;
  repeated RecipeLine recipe = 2;
}
message SaveModifierRecipeResponse {}

service MenuService {
  rpc GetMenu(GetMenuRequest) returns (Menu);
  rpc SaveCategory(SaveCategoryRequest) returns (Category);
  rpc DeleteCategory(DeleteCategoryRequest) returns (DeleteCategoryResponse);
  rpc MoveCategory(MoveCategoryRequest) returns (MoveCategoryResponse);
  rpc SaveItem(SaveItemRequest) returns (MenuItem);         // STALE_VERSION / INVALID(field)
  rpc MoveItem(MoveItemRequest) returns (MoveItemResponse);
  rpc SetItemImage(SetItemImageRequest) returns (MenuItem); // INVALID(image) if too big/wrong type
  rpc Set86(Set86Request) returns (Set86Response);          // emits item.86d per id
  rpc SaveModifierGroup(SaveModifierGroupRequest) returns (ModifierGroup);
  rpc DeleteModifierGroup(DeleteModifierGroupRequest) returns (DeleteModifierGroupResponse);
  rpc SaveRecipe(SaveRecipeRequest) returns (MenuItem);     // INVALID(recipe | variant_recipes) / STALE_VERSION
  rpc SaveModifierRecipe(SaveModifierRecipeRequest) returns (SaveModifierRecipeResponse);
}
