syntax = "proto3";

package restaurant.v1;

import "buf/validate/validate.proto";
import "restaurant/v1/common.proto";

// ---------------------------------------------------------------------------
// OrderService — dine-in and takeaway ordering.
//
// IDEMPOTENCY: every mutating RPC carries a client-generated command_id (UUID).
// The server records it in processed_commands inside the write transaction, so a
// retry returns the ORIGINAL result as a no-op. Offline queues drain in FIFO order.
//
// APPEND-ONLY: order items are never edited after sending. A change is a VOID of
// the old line plus a new line. Each line snapshots name/variant/modifiers and the
// server's unit price at add time, so later menu/price edits never alter it.
//
// OPTIMISTIC LOCK: Order.version. Destructive/structural commands (void, transfer,
// merge, guest count) carry base_version and are rejected with STALE_VERSION on mismatch.
// AddItems does NOT check base_version — adds commute (append-only).
//
// 86 PARTIAL ACCEPT: AddItems rejects only the 86'd lines (ITEM_86D) and applies
// the rest. The server's current price always wins and is snapshotted.
//
// Order identity is the client-supplied order_client_id (stable across offline
// creation); the server also exposes a server id. Either may be used on follow-up
// commands — field comments say which.
//
// WRONG USER: every command takes an optional user_id — the user who queued it
// (offline queues outlive a PIN switch). When set and different from the session's
// user the command is refused with NOT_ALLOWED, field "user_id" (there is no
// dedicated WRONG_USER reason yet), and that check runs before the idempotent
// replay, so a replay under the wrong user is refused too.
// ---------------------------------------------------------------------------

enum OrderType {
  ORDER_TYPE_UNSPECIFIED = 0;
  ORDER_TYPE_DINE_IN = 1;
  ORDER_TYPE_TAKEAWAY = 2;
}

enum OrderStatus {
  ORDER_STATUS_UNSPECIFIED = 0;
  ORDER_STATUS_OPEN = 1;
  ORDER_STATUS_BILLED = 2;    // every live line invoiced, not all handed over yet (still servable)
  ORDER_STATUS_CLOSED = 3;    // every live line on an issued invoice AND handed over
                              // (SERVED, or READY for takeaway); payment is not part of the rule
  ORDER_STATUS_CANCELLED = 4;
}

enum OrderItemStatus {
  ORDER_ITEM_STATUS_UNSPECIFIED = 0;
  ORDER_ITEM_STATUS_DRAFT = 1;     // in the cart, not sent; free to void
  ORDER_ITEM_STATUS_SENT = 2;      // sent to its station
  ORDER_ITEM_STATUS_PREPARING = 3; // KDS marked preparing  (void needs manager approval)
  ORDER_ITEM_STATUS_READY = 4;     // KDS marked ready       (void needs manager approval)
  ORDER_ITEM_STATUS_SERVED = 5;    // delivered to the table (void needs manager approval)
  ORDER_ITEM_STATUS_VOIDED = 6;
}

// Snapshot of a chosen modifier at add time.
message OrderItemModifier {
  LocalText name = 1;
  int64 price_delta_paisa = 2;
}

message OrderItem {
  string id = 1;
  string client_id = 2;     // client-generated UUID, unique per line
  string menu_item_id = 3;

  LocalText name = 4;                       // snapshot
  optional LocalText variant_name = 5;      // snapshot (unset if no variant)
  repeated OrderItemModifier modifiers = 6; // snapshot
  int64 unit_price_paisa = 7;               // snapshot (server price at add time): variant (or item)
                                            // price + the chosen modifiers' price deltas

  int32 quantity = 8;
  string note = 9;
  string station_id = 10;
  OrderItemStatus status = 11;

  // Void metadata, set when status == VOIDED.
  string void_reason = 12;
  string voided_by_user_id = 13;
  string void_approved_by_user_id = 14; // manager approver, if one was required

  int64 sent_at_unix = 15;      // when the line became SENT; 0 while DRAFT
  string added_by_user_id = 16; // who added the line ("" when unknown)
  string invoice_id = 17;       // invoice the line is billed on; "" when unbilled
                                // (cleared again when that invoice is cancelled)
  bool billed = 18;             // invoice_id != ""
  string source = 19;           // "GUEST" when accepted from a guest order (guest.proto); "" otherwise
}

message Order {
  string id = 1;
  string client_id = 2;
  OrderType type = 3;
  optional string table_id = 4; // unset for takeaway
  string waiter_user_id = 5;
  OrderStatus status = 6;
  int32 guest_count = 7;
  int64 version = 8;
  repeated OrderItem items = 9; // includes voided lines (append-only history)

  string label = 10;            // free text, e.g. a takeaway customer name; "" when none
  string waiter_name = 11;      // display name of waiter_user_id
  int64 created_at_unix = 12;
  string reservation_id = 13;    // the booking seated onto this order (reservations.proto); "" when none
  // When a guest tapped Ask for bill (guest.proto); 0 = none. Cleared when staff mark
  // the alert Done or a bill is issued on the order.
  int64 bill_requested_at_unix = 14;
}

// ---- queries ----

message ListOpenOrdersRequest {}
message ListOpenOrdersResponse {
  repeated Order orders = 1;
}

message GetOrderRequest {
  // Exactly one of these identifies the order.
  optional string id = 1;
  optional string client_id = 2;
}

// ---- command results ----

message RejectedLine {
  string client_id = 1; // the NewItem.client_id that was rejected
  ErrorReason reason = 2;
  string message = 3;
}

message OrderResult {
  Order order = 1;
}

// ---- commands ----

message CreateOrderRequest {
  string command_id = 1 [(buf.validate.field).string.min_len = 1];
  string order_client_id = 2 [(buf.validate.field).string.min_len = 1]; // becomes Order.client_id
  OrderType type = 3 [(buf.validate.field).enum = {defined_only: true, not_in: [0]}];
  optional string table_id = 4; // required for DINE_IN, unset for TAKEAWAY
  int32 guest_count = 5 [(buf.validate.field).int32.gte = 0];
  string label = 6 [(buf.validate.field).string.max_len = 80]; // becomes Order.label
  optional string user_id = 7; // see WRONG USER above
}

message NewItem {
  string client_id = 1 [(buf.validate.field).string.min_len = 1];
  string menu_item_id = 2 [(buf.validate.field).string.min_len = 1];
  optional string variant_id = 3;
  repeated string modifier_ids = 4;
  int32 quantity = 5 [(buf.validate.field).int32.gte = 1];
  string note = 6;
}

message AddItemsRequest {
  string command_id = 1 [(buf.validate.field).string.min_len = 1];
  string order_client_id = 2 [(buf.validate.field).string.min_len = 1];
  repeated NewItem items = 3 [(buf.validate.field).repeated.min_items = 1];
  // When true the accepted lines are created already SENT (same effects as a
  // SendItems of exactly those lines, in the same transaction), so one queued
  // client command is one atomic call. Default false: lines are created DRAFT.
  bool send = 4;
  optional string user_id = 5; // see WRONG USER above
}
message AddItemsResult {
  Order order = 1;
  // Lines that were not applied (the rest were): ITEM_86D for an out-of-stock
  // item; INVALID for an unknown/inactive item, a variant or modifier that does
  // not belong to the item, a modifier-group min/max violation, or a line
  // client_id already used on another order. A line whose client_id already
  // exists on this order is a no-op (per-line idempotency), not a rejection.
  repeated RejectedLine rejected = 2;
}

message SendItemsRequest {
  string command_id = 1 [(buf.validate.field).string.min_len = 1];
  string order_client_id = 2 [(buf.validate.field).string.min_len = 1];
  repeated string item_ids = 3; // DRAFT lines to send; empty = all DRAFT lines
  optional string user_id = 4; // see WRONG USER above
}

// item_id (VoidItem) and item_ids (MarkServed, SendItems) accept a line's server id
// or its client_id (OrderItem.client_id).
message VoidItemRequest {
  string command_id = 1 [(buf.validate.field).string.min_len = 1];
  string order_client_id = 2 [(buf.validate.field).string.min_len = 1];
  int64 base_version = 3;
  string item_id = 4 [(buf.validate.field).string.min_len = 1];
  string reason = 5; // required once the line is SENT or later
  optional ManagerApproval approval = 6; // required once the line is PREPARING or later
  optional string user_id = 7; // see WRONG USER above
}

message MarkServedRequest {
  string command_id = 1 [(buf.validate.field).string.min_len = 1];
  string order_client_id = 2 [(buf.validate.field).string.min_len = 1];
  repeated string item_ids = 3 [(buf.validate.field).repeated.min_items = 1];
  optional string user_id = 4; // see WRONG USER above
}

// Move an order to another table. An empty new_table_id moves it off the floor:
// the order becomes TAKEAWAY with no table. Moving to a table makes it DINE_IN.
message TransferTableRequest {
  string command_id = 1 [(buf.validate.field).string.min_len = 1];
  string order_client_id = 2 [(buf.validate.field).string.min_len = 1];
  int64 base_version = 3;
  string new_table_id = 4; // "" = no table (-> TAKEAWAY)
  optional string user_id = 5; // see WRONG USER above
}

// Merge source into target: source's live items move to target (append-only),
// source's guest count is added to target's, then source is CANCELLED. Both
// versions are checked.
message MergeTablesRequest {
  string command_id = 1 [(buf.validate.field).string.min_len = 1];
  string source_order_client_id = 2 [(buf.validate.field).string.min_len = 1];
  int64 source_base_version = 3;
  string target_order_client_id = 4 [(buf.validate.field).string.min_len = 1];
  int64 target_base_version = 5;
  optional string user_id = 6; // see WRONG USER above
}

// Change an OPEN order's guest count. STALE_VERSION on a base_version mismatch.
message SetGuestCountRequest {
  string command_id = 1 [(buf.validate.field).string.min_len = 1];
  string order_client_id = 2 [(buf.validate.field).string.min_len = 1];
  int64 base_version = 3;
  int32 guest_count = 4 [(buf.validate.field).int32 = {gte: 0, lte: 99}];
  optional string user_id = 5; // see WRONG USER above
}

service OrderService {
  rpc ListOpenOrders(ListOpenOrdersRequest) returns (ListOpenOrdersResponse);
  rpc GetOrder(GetOrderRequest) returns (Order);

  rpc CreateOrder(CreateOrderRequest) returns (OrderResult);
  rpc AddItems(AddItemsRequest) returns (AddItemsResult);   // partial accept on 86
  rpc SendItems(SendItemsRequest) returns (OrderResult);    // emits ticket.created
  rpc VoidItem(VoidItemRequest) returns (OrderResult);      // STALE_VERSION / MANAGER_APPROVAL_*
  rpc MarkServed(MarkServedRequest) returns (OrderResult);
  rpc TransferTable(TransferTableRequest) returns (OrderResult);
  rpc MergeTables(MergeTablesRequest) returns (OrderResult);
  rpc SetGuestCount(SetGuestCountRequest) returns (OrderResult); // STALE_VERSION
}
