syntax = "proto3";

package restaurant.v1;

import "buf/validate/validate.proto";
import "restaurant/v1/billing.proto";

// ---------------------------------------------------------------------------
// ShiftService — cash shifts. Several may be open at once (one per cashier).
// Payments attach to the collector's open shift; closing reconciles counted vs
// expected cash.
// ---------------------------------------------------------------------------

enum ShiftStatus {
  SHIFT_STATUS_UNSPECIFIED = 0;
  SHIFT_STATUS_OPEN = 1;
  SHIFT_STATUS_CLOSED = 2;
}

message MethodTotal {
  PaymentMethod method = 1;
  int64 total_paisa = 2;
}

message Shift {
  string id = 1;
  string cashier_user_id = 2;
  int64 opened_at_unix = 3;
  int64 closed_at_unix = 4;
  int64 opening_float_paisa = 5;
  int64 counted_cash_paisa = 6;
  string note = 7;          // the opening note (never overwritten by CloseShift)
  ShiftStatus status = 8;
  string closing_note = 9;  // the note given at close-out
  string cashier_name = 10;
}

message QrPaymentRow {
  string payment_id = 1;
  int32 invoice_number = 2;
  int64 amount_paisa = 3;
  string reference = 4;
  int64 created_at_unix = 5;
}

// One payment taken in the shift (any method).
message ShiftPaymentRow {
  string payment_id = 1;
  string invoice_id = 2;
  int32 invoice_number = 3;
  string display_number = 4;   // "E-2083/84-12" (estimate) or "2083/84-12" (tax invoice)
  PaymentMethod method = 5;
  int64 amount_paisa = 6;
  string reference = 7;
  int64 created_at_unix = 8;
  bool confirmed = 9;          // false while a QR payment is still AWAITING
  bool invoice_cancelled = 10; // the bill has since been cancelled
  // A credit repayment (see credit.proto) instead of a bill payment: invoice_id is
  // empty, payment_id is the repayment id and display_number its "R-12".
  bool repayment = 11;
  string repayment_id = 12;
  bool repayment_voided = 13;  // the repayment has since been voided
}

// A bill cancelled after the shift that took its payment had closed is counted
// back (subtracted) here, in the canceller's shift open at the time of the cancel.
message ShiftAdjustment {
  string id = 1;
  string invoice_id = 2;
  int32 invoice_number = 3;
  string display_number = 4;
  PaymentMethod method = 5;
  int64 amount_paisa = 6;       // positive; subtracted from this shift's takings
  int64 created_at_unix = 7;    // when the bill was cancelled
  string original_shift_id = 8; // the closed shift the payment was taken in
  string payment_id = 9;
  // Set instead of invoice_id/payment_id when a repayment taken in a closed shift
  // was voided; display_number is then its "R-12".
  string repayment_id = 10;
}

// Close-out / report view of a shift.
message ShiftReport {
  Shift shift = 1;
  // Takings by method: confirmed payments, excluding bills cancelled while this
  // shift was open, minus this shift's adjustments.
  repeated MethodTotal totals = 2;
  int64 expected_cash_paisa = 3;       // opening float + cash takings (after adjustments)
  int64 difference_paisa = 4;          // counted - expected (0 unless closed)
  // Deprecated: use payments (QR only, no method or invoice id).
  repeated QrPaymentRow qr_payments = 5;
  repeated ShiftPaymentRow payments = 6;
  repeated ShiftAdjustment adjustments = 7;
  // Credit repayments counted in totals (already included there by method).
  int64 repayments_paisa = 8;
  // On-account amounts billed in this shift (not money; never in totals or expected cash).
  int64 credit_given_paisa = 9;
}

message OpenShiftRequest {
  int64 opening_float_paisa = 1 [(buf.validate.field).int64.gte = 0];
  string note = 2;
}

message GetMyOpenShiftRequest {}
message MyOpenShiftResponse {
  optional Shift shift = 1; // unset when the caller has no open shift
}

message ListOpenShiftsRequest {}
message ListOpenShiftsResponse {
  repeated Shift shifts = 1;
}

message CloseShiftRequest {
  string shift_id = 1 [(buf.validate.field).string.min_len = 1];
  int64 counted_cash_paisa = 2 [(buf.validate.field).int64.gte = 0];
  string note = 3;
}

message ListShiftsRequest {
  int32 limit = 1 [(buf.validate.field).int32 = {gte: 0, lte: 200}]; // 0 -> 50
}
message ListShiftsResponse {
  repeated ShiftReport shifts = 1; // newest first
}

message GetShiftReportRequest {
  string shift_id = 1 [(buf.validate.field).string.min_len = 1];
}

service ShiftService {
  rpc OpenShift(OpenShiftRequest) returns (Shift);
  rpc GetMyOpenShift(GetMyOpenShiftRequest) returns (MyOpenShiftResponse);
  rpc ListOpenShifts(ListOpenShiftsRequest) returns (ListOpenShiftsResponse);
  rpc CloseShift(CloseShiftRequest) returns (ShiftReport);
  rpc GetShiftReport(GetShiftReportRequest) returns (ShiftReport);
  // Recent shifts (open and closed), newest first, each with its report.
  // Cashiers see their own; managers and owners see everyone's.
  rpc ListShifts(ListShiftsRequest) returns (ListShiftsResponse);
}
